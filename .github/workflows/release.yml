name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bitbeak
          - name: x86_64-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: bitbeak
            musl: true
          - name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: bitbeak
          - name: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: bitbeak
          - name: x86_64-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bitbeak.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config
          if [ "${{ matrix.musl }}" = "true" ]; then sudo apt-get install -y musl-tools; fi
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          OUT="dist/bitbeak-${{ matrix.name }}"
          if [[ "${{ matrix.artifact }}" == *.exe ]]; then OUT="${OUT}.exe"; fi
          cp "$BIN" "$OUT"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bitbeak-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
